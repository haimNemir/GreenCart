# Here we define the routes for the frontend, and to backend to Express as a proxy_pass.

server {
    listen 80;
    # When someone access the root of the frontend at port 80 he will show him when the index.html file.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    # When someone access the /api/ route, it will be proxied to the backend at port 3000 to Express.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host; # This line is explained in the comment at the end of this file.
        proxy_set_header X-Real-IP $remote_addr; # Pass the real IP address of the client to the backend as a variable called X-Real-IP and set its value to the $remote_addr variable which contains the IP address of the client.
    }

    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }
}

# When nginx forwards a request to the backend, by default the Host header would 
# be replaced with the backend's address (like localhost:3000).
# This line tells nginx to keep the original Host header — meaning the domain 
# name the user actually typed in the browser (like greencart.com) — and pass it 
# along to the backend.
# This matters when the backend needs to know which domain the request came from, 
# for example if it serves multiple domains or generates URLs based on the host name.